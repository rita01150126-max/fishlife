<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>聲音地圖｜漁生 · 南方澳聲音故事地圖</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Noto+Serif+TC:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --ocean-deep: #133b5c;          /* 核心主色：深海湛藍 */
            --ocean-blue: #1d5687;          /* 亮藍主調 */
            --ocean-soft: #4382b5;          /* 輔助淺藍 */
            --text-main: #133b5c;
            --text-muted: #537591;
            --accent-gold: #f5b349;         /* 金黃強調色 */
            --ocean-soft-bg: #eaf2f8;       /* 淺海柔和藍底色 */
            --ocean-circle-tint: #b8d5ed;   /* 等深線圓圈淡色 */
            --text-dark: #0f172a;
            --border-soft: #d0deeb;
            --brand-gradient: linear-gradient(135deg, #133b5c 0%, #1d5687 50%, #174d75 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Noto Serif TC", "Montserrat", serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* ✨ 關鍵修正：min-height 設為 100vh，確保垂直空間被填滿，Footer 貼底 */
        html, body {
            width: 100%;
            min-height: 100vh !important;
            overflow-x: hidden !important;
            position: relative;
            background-color: var(--ocean-soft-bg);
            color: var(--text-dark);
            line-height: 1.8;
            scroll-behavior: smooth;
            display: flex;
            flex-direction: column;
        }

        /* ===================================================
           🌊 1. 頂部導覽列
           =================================================== */
        .top-notice-bar {
            padding-left: 0 !important;
            position: fixed;
            top: 0; left: 0;
            width: 100%; 
            height: 72px;
            background-color: rgba(246, 250, 254, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(19, 59, 92, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            z-index: 100;
        }

        .notice-brand-logo {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            height: 100%;
        }

        .brand-logo-img {
            height: 100px;
            width: auto;
            max-width: 160px;
            object-fit: contain;
            display: block;
            transition: opacity 0.3s ease;
        }

        .brand-logo-img:hover {
            opacity: 0.85;
        }

        .top-nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-item-link {
            text-decoration: none;
            color: var(--ocean-deep);
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.25s ease;
        }

        .nav-item-link:hover, .nav-item-link.active {
            color: var(--ocean-blue);
            background-color: rgba(19, 59, 92, 0.06);
        }

        .top-burger-btn {
            display: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(19, 59, 92, 0.14);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(19, 59, 92, 0.06);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .top-burger-btn .burger-line {
            width: 18px;
            height: 1.5px;
            background-color: var(--ocean-deep);
            border-radius: 2px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @media (hover: hover) {
            .top-burger-btn:hover {
                background: #ffffff;
                border-color: var(--ocean-blue);
                transform: scale(1.05);
                box-shadow: 0 6px 18px rgba(19, 59, 92, 0.12);
            }
            .top-burger-btn:hover .burger-line:first-child {
                width: 14px;
                transform: translateX(2px);
            }
            .top-burger-btn:hover .burger-line:last-child {
                width: 20px;
                transform: translateX(-1px);
            }
        }

        /* ===================================================
           🗺️ 2. 地圖主區域 (自動伸展填滿垂直空間)
           =================================================== */
        .bg-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 11vw;
            font-weight: 900;
            color: rgba(19, 59, 92, 0.04);
            pointer-events: none;
            z-index: 0;
            white-space: nowrap;
            letter-spacing: 0.1em;
            font-family: 'Montserrat', sans-serif;
        }

        .map-section {
            flex: 1 0 auto; /* 自動伸展以把 Footer 頂到底部 */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 110px 20px 45px;
            position: relative;
            z-index: 10;
        }

        .map-frame {
            position: relative;
            width: 88vw;
            height: 70vh;
            max-width: 1300px;
            min-height: 520px;
            background: #ffffff;
            border-radius: 36px;
            padding: 12px;
            box-shadow: 0 35px 80px rgba(19, 59, 92, 0.12), inset 0 0 30px rgba(19, 59, 92, 0.03);
            border: 1px solid rgba(19, 59, 92, 0.12);
            z-index: 10;
        }

        .map-display {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 26px;
            overflow: hidden;
            background: #091c2e;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.35);
        }

        .map-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.92) contrast(1.05);
            transition: 0.5s ease;
        }

        .map-frame:hover .map-img {
            filter: brightness(1) contrast(1.05);
        }

        /* 聲音按鈕結點 */
        .node {
            position: absolute;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 18px 8px 8px;
            border-radius: 100px;
            cursor: pointer;
            transform: translate(-50%, -50%);
            transition: 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(19, 59, 92, 0.15);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
            z-index: 20;
        }

        .node.active::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 100px;
            border: 2px solid var(--accent-gold);
            animation: ripple 1.6s infinite;
            z-index: -1;
        }

        @keyframes ripple {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        .ctrl-btn {
            width: 32px;
            height: 32px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .play-icon {
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 6px 0 6px 10px;
            border-color: transparent transparent transparent var(--ocean-deep);
            margin-left: 2px;
        }

        .pause-icon {
            display: none;
            width: 10px;
            height: 12px;
            border-left: 3px solid #d34848;
            border-right: 3px solid #d34848;
        }

        .node.active {
            background: var(--ocean-deep);
            color: #ffffff;
            border-color: var(--accent-gold);
            transform: translate(-50%, -50%) scale(1.08);
        }

        .node.active .pause-icon { display: block; }
        .node.active .play-icon { display: none; }
        .node.active .label { color: #ffffff; }

        .node .label {
            color: var(--ocean-deep);
            font-size: 14px;
            font-weight: 800;
            white-space: nowrap;
            letter-spacing: 0.05em;
        }

        @media (hover: hover) {
            .node:hover {
                transform: translate(-50%, -50%) scale(1.05) translateY(-4px);
                box-shadow: 0 14px 30px rgba(0, 0, 0, 0.22);
            }
        }

        .hint {
            position: absolute;
            bottom: 24px;
            right: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #ffffff;
            opacity: 0.75;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            pointer-events: none;
        }

        .map-scroll-hint {
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 11.5px;
            color: var(--ocean-blue);
            letter-spacing: 1.5px;
            margin-top: -10px;
            margin-bottom: 25px;
            font-weight: 700;
            opacity: 0.85;
        }

        /* ===================================================
           📋 3. 側邊抽屜目錄 (精簡窄版)
           =================================================== */
        .drawer-overlay {
            position: fixed;
            top: 0; right: 0;
            width: 100%; height: 100%;
            background: rgba(6, 17, 30, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 600;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .drawer-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .content-drawer {
            position: absolute;
            top: 0; right: 0;
            width: 260px;
            max-width: 72vw;
            height: 100%;
            background: linear-gradient(170deg, #091c2e 0%, #0d2842 50%, #133b5c 100%);
            color: #ffffff;
            padding: 24px 22px 35px;
            transform: translateX(100%);
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            box-shadow: -10px 0 35px rgba(0, 0, 0, 0.45);
        }

        .drawer-overlay.open .content-drawer { 
            transform: translateX(0); 
        }

        .drawer-close {
            align-self: flex-end;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            width: 30px;
            height: 30px;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        @media (hover: hover) {
            .drawer-close:hover {
                border-color: #ffffff;
                background: rgba(255, 255, 255, 0.1);
                transform: rotate(90deg);
            }
        }

        .drawer-menu-container {
            margin-top: 36px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .drawer-menu-link {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.9);
            transition: transform 0.25s ease, color 0.25s ease;
        }

        .drawer-menu-link .slash {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.05rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.4);
            transition: color 0.25s ease, transform 0.25s ease;
        }

        .drawer-menu-link .link-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.92rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        @media (hover: hover) {
            .drawer-menu-link:hover {
                transform: translateX(5px);
                color: #ffffff;
            }
            .drawer-menu-link:hover .slash {
                color: var(--accent-gold);
                transform: scale(1.15);
            }
        }

        .drawer-menu-link.active .link-text {
            color: #ffffff;
            font-weight: 700;
        }
        .drawer-menu-link.active .slash {
            color: var(--accent-gold);
        }

        /* ===================================================
           ⚓ 4. 頁尾 Footer (永遠貼底)
           =================================================== */
        .site-footer {
            width: 100% !important;
            background: rgba(14, 39, 61, 0.96);
            backdrop-filter: blur(14px);
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 24px 60px;
            z-index: 120;
            margin-top: auto; /* 核心：自動推至最底 */
        }

        .footer-left { justify-self: start; }
        .footer-left h4 { font-size: 16px; letter-spacing: 2px; }
        .footer-left p { font-size: 11px; opacity: 0.6; margin-top: 4px; font-family: 'Montserrat', sans-serif; }
        .footer-center { justify-self: center; }

        .footer-back-top-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            padding: 10px 24px;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s ease;
        }

        @media (hover: hover) {
            .footer-back-top-btn:hover {
                background: #ffffff;
                color: var(--ocean-deep);
                border-color: #ffffff;
            }
        }

        .footer-right { justify-self: end; }
        .footer-social-links { display: flex; gap: 12px; }
        .footer-social-btn {
            width: 38px; height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            display: flex; justify-content: center; align-items: center;
            color: #ffffff; text-decoration: none;
            transition: all 0.25s;
        }
        .footer-social-btn svg { width: 17px; height: 17px; fill: currentColor; }

        /* ===================================================
           📱 5. 手機與平板專屬微調 (≤ 1024px)
           =================================================== */
        @media (max-width: 1024px) {
            .top-notice-bar {
                padding: 0 20px;
                height: 64px;
            }

            .brand-logo-img {
                height: 80px;
            }

            .top-nav-links .nav-item-link {
                display: none;
            }

            .top-burger-btn {
                display: flex;
            }

 .map-section {
        padding: 90px 16px 20px !important; /* 左右留 16px 舒適邊界 */
        display: flex !important;
        justify-content: flex-start !important; /* ✨ 關鍵：由左至右，絕不把左邊鎖死 */
        align-items: center !important;
        overflow-x: auto !important;
        overflow-y: hidden !important;
        -webkit-overflow-scrolling: touch;
    }

    /* 2. 地圖外框：移除 margin: auto，只留右側間距 */
    .map-frame {
        width: 860px !important;
        height: 560px !important;
        max-height: 70vh !important;
        min-height: auto;
        margin: 0 !important;              /* ✨ 關鍵：移除 auto，解開左側鎖定 */
        margin-right: 20px !important;     /* 滑到最右邊時留 20px 空間 */
        padding: 8px;
        border-radius: 24px;
        flex-shrink: 0 !important;         /* 嚴禁被擠壓 */
    }

    .map-display {
        border-radius: 18px;
    }

    .node {
        padding: 7px 14px 7px 7px;
    }
    .ctrl-btn {
        width: 28px; height: 28px; margin-right: 8px;
    }
    .node .label {
        font-size: 13px;
    }

    .map-scroll-hint {
        display: flex;
        margin-top: 5px;
        margin-bottom: 25px;
    }

    .site-footer {
        grid-template-columns: 1fr;
        gap: 14px;
        padding: 24px 18px !important;
        text-align: center;
        width: 100% !important;
        margin-top: auto !important;
    }

    .footer-left, .footer-center, .footer-right {
        justify-self: center;
    }
}
    </style>
</head>

    <audio id="audio-steel" src="audio/C0009.mp3" preload="none"></audio>
    <audio id="audio-beach" src="https://www.soundjay.com/nature/ocean-wave-1.mp3" preload="none"></audio>
    <audio id="audio-shipyard" src="https://www.soundjay.com/nature/sounds/fire-1.mp3" preload="none"></audio>
    <audio id="audio-harbor" src="https://www.soundjay.com/nature/sounds/river-1.mp3" preload="none"></audio>

    <script>
        // 1. 點擊 Logo 平滑回到頂端或回首頁
        const navBrandLogo = document.getElementById('navBrandLogo');
        if (navBrandLogo) {
            navBrandLogo.addEventListener('click', (e) => {
                const currentPath = window.location.pathname;
                if (currentPath.endsWith('index.html') || currentPath.endsWith('/') || currentPath === '') {
                    e.preventDefault();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });
        }

        // 2. 回到頂端按鈕
        const backToTopBtn = document.getElementById('backToTopBtn');
        if (backToTopBtn) {
            backToTopBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        // 3. 側邊抽屜目錄開關
        const openDrawerBtn = document.getElementById('openDrawerBtn');
        const closeDrawerBtn = document.getElementById('closeDrawerBtn');
        const drawerOverlay = document.getElementById('drawerOverlay');

        if (openDrawerBtn) {
            openDrawerBtn.addEventListener('click', () => drawerOverlay.classList.add('open'));
        }
        if (closeDrawerBtn) {
            closeDrawerBtn.addEventListener('click', () => drawerOverlay.classList.remove('open'));
        }
        if (drawerOverlay) {
            drawerOverlay.addEventListener('click', (e) => {
                if (e.target === drawerOverlay) drawerOverlay.classList.remove('open');
            });
        }

        // 4. 手機/平板端載入時，將地圖起始位置平滑放在適中視野，且保證能完整往左、往右滑
window.addEventListener('DOMContentLoaded', () => {
    const mapArea = document.getElementById('mapScrollArea');
    if (window.innerWidth <= 1024 && mapArea) {
        // 稍微往內移約 120px 呈現中間碼頭，使用者隨時可以往最左滑看整艘船與南方澳漁港
        setTimeout(() => {
            mapArea.scrollLeft = 80;
        }, 100);
    }
});

        // 5. 聲音標籤播放控制
        let currentAudio = null;
        let currentBtn = null;

        document.querySelectorAll('.node').forEach(btn => {
            btn.addEventListener('click', function() {
                const soundId = this.getAttribute('data-sound');
                const targetAudio = document.getElementById('audio-' + soundId);

                if (!targetAudio) return;

                if (currentAudio === targetAudio) {
                    if (targetAudio.paused) {
                        targetAudio.play();
                        this.classList.add('active');
                    } else {
                        targetAudio.pause();
                        this.classList.remove('active');
                    }
                    return;
                }

                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                    if (currentBtn) currentBtn.classList.remove('active');
                }

                targetAudio.play().catch(err => console.log('音訊自動播放被瀏覽器阻擋:', err));
                this.classList.add('active');
                currentAudio = targetAudio;
                currentBtn = this;

                targetAudio.onended = () => {
                    this.classList.remove('active');
                    currentAudio = null;
                    currentBtn = null;
                };
            });
        });
    </script>
