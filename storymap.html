<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>聲音地圖｜漁生 · 南方澳聲音故事地圖</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Noto+Serif+TC:wght@400;600;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --ocean-deep: #133b5c;          /* 核心主色：深海湛藍 */
            --ocean-blue: #1d5687;          /* 亮藍主調 */
            --ocean-soft: #4382b5;          /* 輔助淺藍 */
            --text-main: #133b5c;
            --text-muted: #537591;
            --accent-gold: #f5b349;         /* 金黃強調色 */
            --ocean-soft-bg: #eaf2f8;       /* 淺海柔和藍底色 */
            --text-dark: #0f172a;
            --border-soft: #d0deeb;
            --brand-gradient: linear-gradient(135deg, #133b5c 0%, #1d5687 50%, #174d75 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Noto Serif TC", "Montserrat", serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh !important;
            overflow-x: hidden !important;
            position: relative;
            background-color: var(--ocean-soft-bg);
            color: var(--text-dark);
            line-height: 1.8;
            scroll-behavior: smooth;
            display: flex;
            flex-direction: column;
        }

        /* ===================================================
           🌊 1. 頂部導覽列
           =================================================== */
        .top-notice-bar {
            padding-left: 0 !important;
            position: fixed;
            top: 0; left: 0;
            width: 100%; 
            height: 72px;
            background-color: rgba(246, 250, 254, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(19, 59, 92, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            z-index: 100;
        }

        .notice-brand-logo {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            height: 100%;
        }

        .brand-logo-img {
            height: 100px;
            width: auto;
            max-width: 160px;
            object-fit: contain;
            display: block;
            transition: opacity 0.3s ease;
        }

        .brand-logo-img:hover {
            opacity: 0.85;
        }

        .top-nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-item-link {
            text-decoration: none;
            color: var(--ocean-deep);
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.25s ease;
        }

        .nav-item-link:hover, .nav-item-link.active {
            color: var(--ocean-blue);
            background-color: rgba(19, 59, 92, 0.06);
        }

        .top-burger-btn {
            display: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(19, 59, 92, 0.14);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(19, 59, 92, 0.06);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .top-burger-btn .burger-line {
            width: 18px;
            height: 1.5px;
            background-color: var(--ocean-deep);
            border-radius: 2px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @media (hover: hover) {
            .top-burger-btn:hover {
                background: #ffffff;
                border-color: var(--ocean-blue);
                transform: scale(1.05);
                box-shadow: 0 6px 18px rgba(19, 59, 92, 0.12);
            }
            .top-burger-btn:hover .burger-line:first-child {
                width: 14px;
                transform: translateX(2px);
            }
            .top-burger-btn:hover .burger-line:last-child {
                width: 20px;
                transform: translateX(-1px);
            }
        }

        /* ===================================================
           🗺️ 2. 地圖主區域 & 上方標題
           =================================================== */
        .bg-text {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 11vw;
            font-weight: 900;
            color: rgba(19, 59, 92, 0.04);
            pointer-events: none;
            z-index: 0;
            white-space: nowrap;
            letter-spacing: 0.1em;
            font-family: 'Montserrat', sans-serif;
        }

        .map-section {
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 95px 20px 35px;
            position: relative;
            z-index: 10;
        }

        .map-top-title-wrapper {
            width: min(88vw, calc((100vh - 250px) * (16 / 9)));
            max-width: 1200px;
            text-align: left;
            margin-bottom: 12px;
            padding-left: 8px;
            z-index: 20;
        }

        .map-top-title {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(16px, 2vw, 24px);
            font-weight: 800;
            color: var(--ocean-deep);
            letter-spacing: 3px;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
        }

        .map-top-title::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(245, 179, 73, 0.5);
            border-radius: 4px;
            z-index: -1;
        }

        .map-frame {
            position: relative;
            width: min(88vw, calc((100vh - 250px) * (16 / 9)));
            max-width: 1200px;
            aspect-ratio: 16 / 9;
            height: auto;
            min-height: unset;
            background: #ffffff;
            border-radius: 32px;
            padding: 10px;
            box-shadow: 0 25px 60px rgba(19, 59, 92, 0.12), inset 0 0 20px rgba(19, 59, 92, 0.03);
            border: 1px solid rgba(19, 59, 92, 0.12);
            z-index: 10;
        }

        .map-display {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 22px;
            overflow: hidden;
            background: #e6f0f5;
        }

        .map-img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            filter: contrast(1.02);
            transition: 0.5s ease;
        }

        /* 聲音按鈕結點（可點擊播放） */
        .node {
            position: absolute;
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 6px 14px 6px 7px;
            border-radius: 100px;
            cursor: pointer;
            transform: translate(-50%, -50%);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease, background-color 0.25s ease;
            border: 1.5px solid rgba(19, 59, 92, 0.16);
            box-shadow: 0 6px 18px rgba(19, 59, 92, 0.15);
            z-index: 20;
            user-select: none;
        }

        /* 觸碰或播放時提高層級，確保照片在最上層 */
        .node:hover, .node.active {
            z-index: 80;
        }

        .node.active::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 100px;
            border: 2px solid var(--accent-gold);
            animation: ripple 1.6s infinite;
            z-index: -1;
        }

        @keyframes ripple {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.35); opacity: 0; }
        }

        .ctrl-btn {
            width: 26px;
            height: 26px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }

        .play-icon {
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 5px 0 5px 8px;
            border-color: transparent transparent transparent var(--ocean-deep);
            margin-left: 2px;
        }

        .pause-icon {
            display: none;
            width: 8px;
            height: 10px;
            border-left: 2.5px solid #d34848;
            border-right: 2.5px solid #d34848;
        }

        .node.active {
            background: var(--ocean-deep);
            border-color: var(--accent-gold);
            transform: translate(-50%, -50%) scale(1.06);
        }

        .node.active .pause-icon { display: block; }
        .node.active .play-icon { display: none; }
        .node.active .label { color: #ffffff; }

        .node .label {
            color: var(--ocean-deep);
            font-family: 'Zen Maru Gothic', 'Noto Serif TC', sans-serif;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            letter-spacing: 0.04em;
        }

        @media (hover: hover) {
            .node:hover {
                transform: translate(-50%, -50%) scale(1.06) translateY(-2px);
                box-shadow: 0 10px 24px rgba(19, 59, 92, 0.22);
                border-color: var(--ocean-blue);
            }
        }

        /* ===================================================
           📍 純文字地點標籤（無聲音、支援觸碰/點擊彈出照片）
           =================================================== */
        .static-badge {
            position: absolute;
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 5px 13px;
            border-radius: 100px;
            border: 1px solid rgba(19, 59, 92, 0.16);
            box-shadow: 0 4px 12px rgba(19, 59, 92, 0.1);
            transform: translate(-50%, -50%);
            z-index: 15;
            cursor: pointer;
            user-select: none;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .static-badge:hover, .static-badge.active {
            z-index: 80;
            border-color: var(--ocean-blue);
            box-shadow: 0 8px 20px rgba(19, 59, 92, 0.18);
        }

        @media (hover: hover) {
            .static-badge:hover {
                transform: translate(-50%, -50%) scale(1.06) translateY(-2px);
            }
        }

        .static-badge .label {
            color: var(--ocean-deep);
            font-family: 'Zen Maru Gothic', 'Noto Serif TC', sans-serif;
            font-size: 12.5px;
            font-weight: 700;
            white-space: nowrap;
            letter-spacing: 0.04em;
        }

        /* ===================================================
           🖼️ 純照片彈出預覽小卡（無文字、加大版、智慧避遮擋）
           =================================================== */
        .node-preview-card {
            position: absolute;
            bottom: calc(100% + 12px);
            left: 50%;
            width: 210px;
            background: #ffffff;
            padding: 6px;
            border-radius: 14px;
            border: 1.5px solid rgba(19, 59, 92, 0.16);
            box-shadow: 0 14px 32px rgba(11, 29, 45, 0.24);
            opacity: 0;
            visibility: hidden;
            transform: translate3d(-50%, 6px, 0) scale(0.95);
            transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.2s;
            pointer-events: none;
            will-change: opacity, transform;
            z-index: 90;
        }

        /* 底部指示小三角（預設在下方） */
        .node-preview-card::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px;
            border-style: solid;
            border-color: #ffffff transparent transparent transparent;
        }

        /* 靠上方的節點（龍德、豆腐岬、三剛）：改為往下彈出，避免切出地圖頂部 */
        .node-preview-card.pop-bottom {
            bottom: auto;
            top: calc(100% + 12px);
            transform: translate3d(-50%, -6px, 0) scale(0.95);
        }

        .node-preview-card.pop-bottom::after {
            top: auto;
            bottom: 100%;
            border-color: transparent transparent #ffffff transparent;
        }

        /* 靠右方的節點（全福、豆腐岬、內埤）：靠右對齊防切邊 */
        .node-preview-card.align-right {
            left: auto;
            right: -12px;
            transform: translate3d(0, 6px, 0) scale(0.95);
        }

        .node-preview-card.align-right.pop-bottom {
            transform: translate3d(0, -6px, 0) scale(0.95);
        }

        .node-preview-card.align-right::after {
            left: auto;
            right: 28px;
        }

        .node-preview-card img {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 9px;
            display: block;
            background-color: #e6f0f5;
        }

        /* 滑鼠移過去顯示（支援聲音節點與純地點標籤） */
        @media (hover: hover) {
            .node:hover .node-preview-card,
            .static-badge:hover .node-preview-card {
                opacity: 1;
                visibility: visible;
                transform: translate3d(-50%, 0, 0) scale(1);
            }
            .node:hover .node-preview-card.align-right,
            .static-badge:hover .node-preview-card.align-right {
                transform: translate3d(0, 0, 0) scale(1);
            }
        }

        /* 播放聲音或手機點擊時同步顯示 */
        .node.active .node-preview-card,
        .static-badge.active .node-preview-card {
            opacity: 1;
            visibility: visible;
            transform: translate3d(-50%, 0, 0) scale(1);
            border-color: var(--accent-gold);
        }
        .node.active .node-preview-card.align-right,
        .static-badge.active .node-preview-card.align-right {
            transform: translate3d(0, 0, 0) scale(1);
        }

        .map-scroll-hint {
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 11.5px;
            color: var(--ocean-blue);
            letter-spacing: 1.5px;
            margin-top: -10px;
            margin-bottom: 25px;
            font-weight: 700;
            opacity: 0.85;
        }

        /* ===================================================
           📋 3. 側邊抽屜目錄
           =================================================== */
        .drawer-overlay {
            position: fixed;
            top: 0; right: 0;
            width: 100%; height: 100%;
            background: rgba(6, 17, 30, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 600;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .drawer-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .content-drawer {
            position: absolute;
            top: 0; right: 0;
            width: 260px;
            max-width: 72vw;
            height: 100%;
            background: linear-gradient(170deg, #091c2e 0%, #0d2842 50%, #133b5c 100%);
            color: #ffffff;
            padding: 24px 22px 35px;
            transform: translateX(100%);
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            box-shadow: -10px 0 35px rgba(0, 0, 0, 0.45);
        }

        .drawer-overlay.open .content-drawer { 
            transform: translateX(0); 
        }

        .drawer-close {
            align-self: flex-end;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            width: 30px;
            height: 30px;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        @media (hover: hover) {
            .drawer-close:hover {
                border-color: #ffffff;
                background: rgba(255, 255, 255, 0.1);
                transform: rotate(90deg);
            }
        }

        .drawer-main-pages {
            margin-top: 36px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .drawer-menu-link {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.9);
            transition: transform 0.25s ease, color 0.25s ease;
        }

        .drawer-menu-link .slash {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.05rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.4);
            transition: color 0.25s ease, transform 0.25s ease;
        }

        .drawer-menu-link .link-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.92rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        @media (hover: hover) {
            .drawer-menu-link:hover {
                transform: translateX(5px);
                color: #ffffff;
            }
            .drawer-menu-link:hover .slash {
                color: var(--accent-gold);
                transform: scale(1.15);
            }
        }

        .drawer-menu-link.active .link-text {
            color: #ffffff;
            font-weight: 700;
        }
        .drawer-menu-link.active .slash {
            color: var(--accent-gold);
        }

        /* ===================================================
           ⚓ 4. 頁尾 Footer
           =================================================== */
        .site-footer {
            width: 100% !important;
            background: rgba(14, 39, 61, 0.96);
            backdrop-filter: blur(14px);
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 24px 60px;
            z-index: 120;
            margin-top: auto;
        }

        .footer-left { justify-self: start; }
        .footer-left h4 { font-size: 16px; letter-spacing: 2px; }
        .footer-left p { font-size: 11px; opacity: 0.6; margin-top: 4px; font-family: 'Montserrat', sans-serif; }
        .footer-center { justify-self: center; }

        .footer-back-top-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            padding: 10px 24px;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s ease;
        }

        @media (hover: hover) {
            .footer-back-top-btn:hover {
                background: #ffffff;
                color: var(--ocean-deep);
                border-color: #ffffff;
            }
        }

        .footer-right { justify-self: end; }
        .footer-social-links { display: flex; gap: 12px; }
        .footer-social-btn {
            width: 38px; height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            display: flex; justify-content: center; align-items: center;
            color: #ffffff; text-decoration: none;
            transition: all 0.25s;
        }
        .footer-social-btn svg { width: 17px; height: 17px; fill: currentColor; }

        /* ===================================================
           📱 5. 手機與平板專屬微調
           =================================================== */
        @media (max-width: 1024px) {
            .top-notice-bar {
                padding: 0 20px;
                height: 64px;
            }

            .brand-logo-img {
                height: 80px;
            }

            .top-nav-links .nav-item-link {
                display: none;
            }

            .top-burger-btn {
                display: flex;
            }

            .map-section {
                padding: 85px 0 20px 0 !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: flex-start !important;
                align-items: flex-start !important;
                overflow-x: auto !important;
                overflow-y: hidden !important;
                -webkit-overflow-scrolling: touch;
                width: 100% !important;
            }

            .map-top-title-wrapper {
                width: 900px !important;
                margin: 0 16px 8px 16px !important;
                padding-left: 0 !important;
                flex-shrink: 0 !important;
            }

            .map-top-title {
                font-size: 15px;
                letter-spacing: 2px;
            }

            .map-frame {
                width: 900px !important;
                height: auto !important;
                aspect-ratio: 16 / 9;
                margin: 0 16px !important;
                padding: 8px;
                border-radius: 24px;
                flex-shrink: 0 !important;
            }

            .map-display {
                border-radius: 18px;
            }

            .node {
                padding: 5px 11px 5px 5px;
            }
            .ctrl-btn {
                width: 22px; height: 22px; margin-right: 6px;
            }
            .play-icon {
                border-width: 4px 0 4px 6px;
            }
            .pause-icon {
                width: 6px; height: 8px; border-width: 2px;
            }
            .node .label, .static-badge .label {
                font-size: 11px;
            }

            .static-badge {
                padding: 4px 9px;
            }

            .node-preview-card {
                width: 165px;
                padding: 5px;
            }

            .map-scroll-hint {
                display: flex;
                margin-top: 5px;
                margin-bottom: 25px;
            }

            .site-footer {
                grid-template-columns: 1fr;
                gap: 14px;
                padding: 24px 18px !important;
                text-align: center;
                width: 100% !important;
                margin-top: auto !important;
            }

            .footer-left, .footer-center, .footer-right {
                justify-self: center;
            }
        }
    </style>
</head>
<body>

    <div class="bg-text">NANFANG'AO STORY</div>

   <nav class="top-notice-bar">
        <a href="index.html" class="notice-brand-logo" id="navBrandLogo" title="返回首頁">
            <img src="image/Logo.png" alt="漁生" class="brand-logo-img">
        </a>
        <div class="top-nav-links">

    <script>
        // 1. 點擊 Logo 平滑回到頂端或回首頁
        const navBrandLogo = document.getElementById('navBrandLogo');
        if (navBrandLogo) {
            navBrandLogo.addEventListener('click', (e) => {
                const currentPath = window.location.pathname;
                if (currentPath.endsWith('index.html') || currentPath.endsWith('/') || currentPath === '') {
                    e.preventDefault();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });
        }

        // 2. 回到頂端按鈕
        const backToTopBtn = document.getElementById('backToTopBtn');
        if (backToTopBtn) {
            backToTopBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        // 3. 側邊抽屜目錄開關
        const openDrawerBtn = document.getElementById('openDrawerBtn');
        const closeDrawerBtn = document.getElementById('closeDrawerBtn');
        const drawerOverlay = document.getElementById('drawerOverlay');

        if (openDrawerBtn) {
            openDrawerBtn.addEventListener('click', () => drawerOverlay.classList.add('open'));
        }
        if (closeDrawerBtn) {
            closeDrawerBtn.addEventListener('click', () => drawerOverlay.classList.remove('open'));
        }
        if (drawerOverlay) {
            drawerOverlay.addEventListener('click', (e) => {
                if (e.target === drawerOverlay) drawerOverlay.classList.remove('open');
            });
        }

        // 4. 手機端預設貼齊最左側
        window.addEventListener('DOMContentLoaded', () => {
            const mapArea = document.getElementById('mapScrollArea');
            if (window.innerWidth <= 1024 && mapArea) {
                mapArea.scrollLeft = 0;
            }
        });

        // 5. 聲音播放控制與純地點點擊預覽
        let currentAudio = null;
        let currentBtn = null;

        function resetCurrentBtn() {
            if (currentBtn) {
                currentBtn.classList.remove('active');
            }
            if (currentAudio) {
                currentAudio.onended = null;
            }
            currentAudio = null;
            currentBtn = null;
        }

        // 聲音節點點擊播放
        document.querySelectorAll('.node').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                document.querySelectorAll('.static-badge').forEach(b => b.classList.remove('active'));

                const soundId = this.getAttribute('data-sound');
                const targetAudio = document.getElementById('audio-' + soundId);

                if (!targetAudio) return;

                if (currentAudio === targetAudio) {
                    if (targetAudio.paused) {
                        targetAudio.play().catch(err => console.log('音訊播放被阻擋:', err));
                        this.classList.add('active');
                    } else {
                        targetAudio.pause();
                        this.classList.remove('active');
                    }
                    return;
                }

                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                    resetCurrentBtn();
                }

                targetAudio.play().then(() => {
                    this.classList.add('active');
                    currentAudio = targetAudio;
                    currentBtn = this;

                    targetAudio.onended = () => {
                        resetCurrentBtn();
                    };
                }).catch(err => {
                    console.log('音訊播放被瀏覽器阻擋或找不到音檔:', err);
                    resetCurrentBtn();
                });
            });
        });

        // 手機/平板點擊純地點標籤時切換照片預覽
        document.querySelectorAll('.static-badge').forEach(badge => {
            badge.addEventListener('click', function(e) {
                e.stopPropagation();
                const isActive = this.classList.contains('active');
                document.querySelectorAll('.static-badge').forEach(b => b.classList.remove('active'));
                if (!isActive) {
                    this.classList.add('active');
                }
            });
        });

        // 點擊地圖空白處關閉純地點標籤的照片預覽
        document.addEventListener('click', () => {
            document.querySelectorAll('.static-badge').forEach(b => b.classList.remove('active'));
        });
    </script>
