<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>田野攝影集｜關於大海 你的記憶是什麼？｜漁生</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Noto+Serif+TC:wght@400;600;700;900&family=Shippori+Mincho:wght@700;800&display=swap" rel="stylesheet">

    <!-- PDF.js 核心庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        :root {
            --ocean-deep: #133b5c;          /* 核心主色：深海湛藍 */
            --ocean-blue: #1d5687;          /* 亮藍主調 */
            --ocean-soft: #4382b5;          /* 輔助淺藍 */
            --text-main: #133b5c;
            --text-muted: #537591;
            --accent-gold: #f5b349;         /* 統一暖金黃強調色 */
            --ocean-soft-bg: #edf3f8;       /* 柔和淺海藍底色 */
            --text-dark: #1e293b;
            --border-soft: #d0deeb;
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Noto Serif TC", "Montserrat", serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--ocean-soft-bg);
            color: var(--text-dark);
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ===================================================
           🌊 1. 頂部導覽列 (全站標準規範)
           =================================================== */
        .top-notice-bar {
            padding-left: 0 !important;
            position: fixed;
            top: 0; left: 0;
            width: 100%; 
            height: 72px;
            background-color: rgba(246, 250, 254, 0.94);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(19, 59, 92, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            z-index: 100;
        }

        .notice-brand-logo {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            height: 100%;
        }

        .brand-logo-img {
            height: 100px;
            width: auto;
            max-width: 160px;
            object-fit: contain;
            display: block;
            transition: opacity 0.3s ease;
        }

        .brand-logo-img:hover {
            opacity: 0.85;
        }

        .top-nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-item-link {
            text-decoration: none;
            color: var(--ocean-deep);
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.25s ease;
        }

        .nav-item-link:hover, .nav-item-link.active {
            color: var(--ocean-blue);
            background-color: rgba(19, 59, 92, 0.06);
        }

        .top-burger-btn {
            display: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(19, 59, 92, 0.14);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(19, 59, 92, 0.06);
            transition: all 0.35s var(--ease-out-expo);
        }

        .top-burger-btn .burger-line {
            width: 18px;
            height: 1.5px;
            background-color: var(--ocean-deep);
            border-radius: 2px;
            transition: all 0.3s var(--ease-out-expo);
        }

        /* ===================================================
           📖 2. 攝影集頁首標題區
           =================================================== */
        .gallery-header-section {
            padding: 135px 30px 20px;
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
        }

        .gallery-meta-tag {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.82rem;
            letter-spacing: 3.5px;
            color: var(--accent-gold);
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 12px;
            display: inline-block;
        }

        .gallery-page-title {
            font-family: 'Shippori Mincho', "Noto Serif TC", serif;
            font-size: clamp(2rem, 4vw, 3.2rem);
            font-weight: 800;
            color: var(--ocean-deep);
            line-height: 1.35;
            letter-spacing: 0.05em;
            margin-bottom: 14px;
        }

        .gallery-page-sub {
            font-size: 1.05rem;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            line-height: 1.8;
            font-weight: 600;
        }

        /* ===================================================
           📚 3. 翻頁式電子攝影集容器 (Flipbook Section)
           =================================================== */
        .flipbook-main-section {
            flex: 1;
            max-width: 1380px;
            width: 100%;
            margin: 0 auto;
            padding: 10px 24px 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 工具列：全螢幕按鈕靠右 */
        .flipbook-toolbar {
            width: 100%;
            max-width: 960px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px 12px;
            margin-bottom: 15px;
        }

        .tool-btn {
            background: #ffffff;
            border: 1px solid var(--border-soft);
            color: var(--ocean-deep);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 8px 20px;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(19, 59, 92, 0.05);
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .tool-btn:hover {
            background: var(--ocean-deep);
            color: #ffffff;
            border-color: var(--ocean-deep);
            transform: translateY(-2px);
        }

        /* 書本舞台區 */
        .book-stage-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 2000px;
        }

        /* 書本展開框; */
        .book-spread-box {
            position: relative;
            background: #4f5b6d;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 25px 60px rgba(11, 29, 45, 0.16), 0 0 0 1px rgba(19, 59, 92, 0.06);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            min-height: 480px;
            max-width: 95vw;
            transition: box-shadow 0.3s ease;
        }

        /* 書脊中縫陰影 (雙頁模式) */
        .book-spread-box::after {
            content: '';
            position: absolute;
            top: 20px;
            bottom: 20px;
            left: 50%;
            width: 2px;
            transform: translateX(-50%);
            background: linear-gradient(to right, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.02) 50%, rgba(0, 0, 0, 0.12));
            pointer-events: none;
            opacity: 0.7;
            display: block;
        }

        .book-spread-box.single-mode::after {
            display: none;
        }

        /* 左右頁面的 Canvas */
        .page-canvas {
            display: block;
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            background-color: #ffffff;
        }

        .page-canvas.hidden {
            display: none !important;
        }

        /* 左右翻頁懸浮箭頭 (永遠保持可點選以實現循環輪播) */
        .nav-flip-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid var(--border-soft);
            color: var(--ocean-deep);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(19, 59, 92, 0.15);
            transition: all 0.25s var(--ease-out-expo);
            z-index: 20;
        }

        .nav-flip-btn.prev {
            left: max(10px, calc(50% - 640px));
        }

        .nav-flip-btn.next {
            right: max(10px, calc(50% - 640px));
        }

        .nav-flip-btn svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            stroke-width: 2.5;
            fill: none;
            transition: transform 0.2s ease;
        }

        .nav-flip-btn:hover {
            background: var(--ocean-deep);
            color: #ffffff;
            border-color: var(--ocean-deep);
            transform: translateY(-50%) scale(1.1);
        }

        /* 載入中動畫層 */
        .book-loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
            color: var(--ocean-deep);
            font-weight: 700;
            letter-spacing: 1px;
            z-index: 10;
        }

        .spinner {
            width: 38px;
            height: 38px;
            border: 3px solid rgba(19, 59, 92, 0.15);
            border-top-color: var(--accent-gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 📍 頁碼：置於正下方正中間 */
        .page-indicator-center {
            margin-top: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page-badge-pill {
            background: #ffffff;
            border: 1px solid var(--border-soft);
            box-shadow: 0 4px 18px rgba(19, 59, 92, 0.06);
            padding: 8px 24px;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--ocean-deep);
            letter-spacing: 2px;
        }

        /* ===================================================
           📋 4. 側邊抽屜（純淨版主選單）
           =================================================== */
        .drawer-overlay {
            position: fixed;
            top: 0; right: 0;
            width: 100%; height: 100%;
            background: rgba(6, 17, 30, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 600;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .drawer-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .content-drawer {
            position: absolute;
            top: 0; right: 0;
            width: 390px;
            max-width: 88vw;
            height: 100%;
            background: linear-gradient(175deg, #091c2e 0%, #0d2842 45%, #133b5c 100%);
            color: #ffffff;
            padding: 26px 28px 45px;
            transform: translateX(100%);
            transition: transform 0.45s var(--ease-out-expo);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            box-shadow: -15px 0 45px rgba(0, 0, 0, 0.5);
        }

        .drawer-overlay.open .content-drawer { 
            transform: translateX(0); 
        }

        .drawer-close {
            align-self: flex-end;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.22);
            color: #ffffff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .drawer-menu-container {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
        }

        .drawer-main-pages {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 6px 0 18px 0;
        }

        .drawer-menu-link {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.9);
            transition: transform 0.25s ease, color 0.25s ease;
        }

        .drawer-menu-link .slash {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.15rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.4);
            transition: color 0.25s ease, transform 0.25s ease;
        }

        .drawer-menu-link .link-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .drawer-menu-link:hover {
            transform: translateX(4px);
            color: #ffffff;
        }

        .drawer-menu-link:hover .slash {
            color: var(--accent-gold);
            transform: scale(1.15);
        }

        .drawer-menu-link.active .link-text {
            color: #ffffff;
            font-weight: 800;
        }

        .drawer-menu-link.active .slash {
            color: var(--accent-gold);
        }

        /* ===================================================
           ⚓ 5. 頁尾 Footer (全站標準規範)
           =================================================== */
        .site-footer {
            position: fixed;
            bottom: 0; left: 0;
            width: 100vw;
            background: rgba(14, 39, 61, 0.96);
            backdrop-filter: blur(14px);
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 24px 60px;
            z-index: 120;
            transform: translateY(100%);
            transition: transform 0.4s ease;
        }

        .site-footer.show {
            transform: translateY(0);
        }

        .footer-left {
            justify-self: start;
        }

        .footer-left h4 {
            font-size: 16px;
            letter-spacing: 2px;
        }

        .footer-left p {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 4px;
            font-family: 'Montserrat', sans-serif;
        }

        .footer-center {
            justify-self: center;
        }

        .footer-back-top-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            padding: 10px 24px;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s ease;
        }

        .footer-back-top-btn:hover {
            background: #ffffff;
            color: var(--ocean-deep);
        }

        .footer-right {
            justify-self: end;
        }

        .footer-social-links {
            display: flex;
            gap: 12px;
        }

        .footer-social-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-decoration: none;
            transition: all 0.25s;
        }

        .footer-social-btn svg {
            width: 17px;
            height: 17px;
            fill: currentColor;
        }

        /* ===================================================
           📱 6. 響應式調整 (≤ 1024px)：強制切為單頁
           =================================================== */
        @media (max-width: 1024px) {
            .top-notice-bar {
                padding: 0 20px !important;
                height: 64px;
            }

            .brand-logo-img {
                height: 80px;
                margin-left: -20px !important;
            }

            .top-nav-links .nav-item-link {
                display: none;
            }

            .top-burger-btn {
                display: flex;
            }

            .gallery-header-section {
                padding: 100px 20px 15px;
            }

            .flipbook-toolbar {
                justify-content: center;
                margin-bottom: 12px;
            }

            .book-spread-box {
                padding: 10px;
                gap: 0;
            }

            .nav-flip-btn {
                width: 44px;
                height: 44px;
            }

            .nav-flip-btn.prev {
                left: 6px;
            }

            .nav-flip-btn.next {
                right: 6px;
            }

            .site-footer {
                position: static !important;
                transform: none !important;
                grid-template-columns: 1fr;
                gap: 16px;
                padding: 30px 20px !important;
                text-align: center;
            }

            .footer-left, .footer-center, .footer-right {
                justify-self: center;
            }
        }
    </style>
</head>

    <!-- 🎬 頁面標題 -->

    <!-- 📚 電子攝影書主體 -->

            <!-- 下一頁按鈕 (最後一頁點擊會轉回第一頁) -->
            <button class="nav-flip-btn next" id="nextPageBtn" aria-label="下一頁">
                <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>

        <!-- 📍 頁碼：放置於正下方正中間 -->

                    <a href="photo.html" class="drawer-menu-link active">
                        <span class="slash">／</span>
                        <span class="link-text">OUR MEMORIES</span>
                    </a>
                     <a href="About_us.html" class="drawer-menu-link">
                        <span class="slash">／</span>
                        <span class="link-text">ABOUT US</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- ⚓ 滑到底部升起的 Footer (標準三欄式：TOP 置中) -->
    <footer class="site-footer" id="siteFooter">
        <div class="footer-left">
            <h4>漁生 · 南方澳的故事</h4>
            <p>© 2026 NANFANG'AO PROJECT. ALL RIGHTS RESERVED.</p>
        </div>

        <div class="footer-center">
            <button class="footer-back-top-btn" id="backToTopBtn">
                <span>TOP</span>
                <span>↑</span>
            </button>
        </div>
        
        <div class="footer-right">

    <!-- ===================================================
         💻 PDF.js 翻書控制（雙向無限循環輪播）
         =================================================== -->
    <script>
        // PDF 檔案路徑（請確認與專案內實際檔名一致）
        const PDF_URL = 'photo.pdf';

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let pdfDoc = null;
        let currentPageNum = 1;
        let totalPages = 0;
        let isRendering = false;

        const isMobileView = () => window.innerWidth <= 1024;

        const canvasLeft = document.getElementById('canvasLeft');
        const canvasRight = document.getElementById('canvasRight');
        const ctxLeft = canvasLeft.getContext('2d');
        const ctxRight = canvasRight.getContext('2d');
        const bookSpread = document.getElementById('bookSpread');
        const bookLoader = document.getElementById('bookLoader');
        const pageIndicator = document.getElementById('pageIndicator');
        const prevBtn = document.getElementById('prevPageBtn');
        const nextBtn = document.getElementById('nextPageBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        // 載入 PDF 文件
        pdfjsLib.getDocument(PDF_URL).promise.then(pdf => {
            pdfDoc = pdf;
            totalPages = pdf.numPages;
            bookLoader.style.display = 'none';
            renderCurrentSpread();
        }).catch(err => {
            console.error('PDF 載入失敗：', err);
            bookLoader.innerHTML = `<span style="color:#e63946;">PDF 載入失敗，請確認檔案路徑是否正確（例如 pdf/memory_of_sea.pdf）。</span>`;
        });

        // 渲染指定頁面至指定的 canvas
        async function renderPageToCanvas(pageNum, canvas, ctx) {
            const page = await pdfDoc.getPage(pageNum);
            
            const unscaledViewport = page.getViewport({ scale: 1 });
            let targetWidth = window.innerWidth * 0.88;

            if (!isMobileView()) {
                targetWidth = targetWidth / 2;
            }
            targetWidth = Math.min(targetWidth, 580);

            const scale = (targetWidth / unscaledViewport.width) * (window.devicePixelRatio || 1);
            const viewport = page.getViewport({ scale: scale });

            canvas.width = viewport.width;
            canvas.height = viewport.height;
            canvas.style.width = `${viewport.width / (window.devicePixelRatio || 1)}px`;
            canvas.style.height = `${viewport.height / (window.devicePixelRatio || 1)}px`;

            const renderContext = {
                canvasContext: ctx,
                viewport: viewport
            };

            await page.render(renderContext).promise;
            canvas.classList.remove('hidden');
        }

        // 渲染當前頁面
        async function renderCurrentSpread() {
            if (!pdfDoc || isRendering) return;
            isRendering = true;

            if (!isMobileView()) {
                // 💻 電腦版：強制雙頁展示（連封面也為 1-2 雙頁展開）
                bookSpread.classList.remove('single-mode');

                const leftPage = currentPageNum;
                const rightPage = currentPageNum + 1 <= totalPages ? currentPageNum + 1 : null;

                await renderPageToCanvas(leftPage, canvasLeft, ctxLeft);

                if (rightPage) {
                    await renderPageToCanvas(rightPage, canvasRight, ctxRight);
                    pageIndicator.innerText = `${leftPage} - ${rightPage} / ${totalPages}`;
                } else {
                    canvasRight.classList.add('hidden');
                    pageIndicator.innerText = `${leftPage} / ${totalPages}`;
                }
            } else {
                // 📱 手機版：強制單頁展示
                bookSpread.classList.add('single-mode');
                canvasLeft.classList.add('hidden');

                await renderPageToCanvas(currentPageNum, canvasRight, ctxRight);
                pageIndicator.innerText = `${currentPageNum} / ${totalPages}`;
            }

            // 按鈕永遠不反灰，隨時可點選循環
            prevBtn.disabled = false;
            nextBtn.disabled = false;

            isRendering = false;
        }

        // 判定是否已翻到最後一組對頁
        function isAtLastPage() {
            if (!pdfDoc) return false;
            if (!isMobileView()) {
                return currentPageNum + 1 >= totalPages || currentPageNum >= totalPages;
            } else {
                return currentPageNum >= totalPages;
            }
        }

        // 上一頁（第一頁再點則循環至最後一頁）
        function goPrevPage() {
            if (isRendering || !pdfDoc) return;

            if (!isMobileView()) {
                if (currentPageNum <= 1) {
                    // 電腦版循環到最後一對雙頁（奇數開頭）
                    currentPageNum = totalPages % 2 === 0 ? totalPages - 1 : totalPages;
                } else {
                    currentPageNum = Math.max(1, currentPageNum - 2);
                }
            } else {
                if (currentPageNum <= 1) {
                    currentPageNum = totalPages;
                } else {
                    currentPageNum -= 1;
                }
            }
            renderCurrentSpread();
        }

        // 下一頁（最後一頁再點則循環回第一頁）
        function goNextPage() {
            if (isRendering || !pdfDoc) return;

            if (isAtLastPage()) {
                currentPageNum = 1;
                renderCurrentSpread();
                return;
            }

            if (!isMobileView()) {
                if (currentPageNum + 2 <= totalPages) {
                    currentPageNum += 2;
                }
            } else {
                if (currentPageNum < totalPages) {
                    currentPageNum += 1;
                }
            }
            renderCurrentSpread();
        }

        prevBtn.addEventListener('click', goPrevPage);
        nextBtn.addEventListener('click', goNextPage);

        // 鍵盤 ← / → 翻頁（同步支援循環）
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') goPrevPage();
            if (e.key === 'ArrowRight') goNextPage();
        });

        // 手機端 Touch 左右滑動翻頁（同步支援循環）
        let touchStartX = 0;
        bookSpread.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
        }, { passive: true });

        bookSpread.addEventListener('touchend', (e) => {
            const diffX = e.changedTouches[0].clientX - touchStartX;
            if (Math.abs(diffX) > 40) {
                if (diffX < 0) goNextPage();
                else goPrevPage();
            }
        }, { passive: true });

        // 全螢幕閱讀切換
        fullscreenBtn.addEventListener('click', () => {
            const stage = document.getElementById('bookStage');
            if (!document.fullscreenElement) {
                stage.requestFullscreen().catch(err => alert(`無法進入全螢幕：${err.message}`));
            } else {
                document.exitFullscreen();
            }
        });

        // 視窗尺寸改變時重新適配
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (!isMobileView() && currentPageNum % 2 === 0) {
                    currentPageNum = Math.max(1, currentPageNum - 1);
                }
                renderCurrentSpread();
            }, 200);
        });

        // 側邊抽屜開關控制
        const openDrawerBtn = document.getElementById('openDrawerBtn');
        const closeDrawerBtn = document.getElementById('closeDrawerBtn');
        const drawerOverlay = document.getElementById('drawerOverlay');

        if (openDrawerBtn) openDrawerBtn.addEventListener('click', () => drawerOverlay.classList.add('open'));
        if (closeDrawerBtn) closeDrawerBtn.addEventListener('click', () => drawerOverlay.classList.remove('open'));
        if (drawerOverlay) {
            drawerOverlay.addEventListener('click', (e) => {
                if (e.target === drawerOverlay) drawerOverlay.classList.remove('open');
            });
        }

        // Footer 滾動升起與回頂端監聽
        const siteFooter = document.getElementById('siteFooter');
        const backToTopBtn = document.getElementById('backToTopBtn');

        window.addEventListener('scroll', () => {
            if (window.innerWidth > 1024) {
                const scrollPosition = window.innerHeight + window.pageYOffset;
                const threshold = document.documentElement.scrollHeight - 80;

                if (scrollPosition >= threshold) {
                    siteFooter.classList.add('show');
                } else {
                    siteFooter.classList.remove('show');
                }
            }
        }, { passive: true });

        if (backToTopBtn) {
            backToTopBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }
    </script>
